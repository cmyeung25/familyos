services:
  familyos-gary-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: familyos:gary
    env_file:
      - ./instances/gary/.env
    environment:
      FAMILY_OS_SERVICE_MODE: bot
      FAMILY_OS_HEALTHCHECK_MODE: bot
    volumes:
      - ./instances/gary:/data/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  familyos-gary-reminder:
    image: familyos:gary
    depends_on:
      familyos-gary-bot:
        condition: service_started
    env_file:
      - ./instances/gary/.env
    environment:
      FAMILY_OS_SERVICE_MODE: reminder
      FAMILY_OS_HEALTHCHECK_MODE: reminder
    volumes:
      - ./instances/gary:/data/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/docker/healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
