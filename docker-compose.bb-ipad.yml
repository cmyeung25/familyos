services:
  familyos-bb-ipad:
    build:
      context: ./family-os-bb-ipad-webapp
      dockerfile: Dockerfile
    image: familyos:bb-ipad
    env_file:
      - ./instances/gary/secrets/bb-ipad.env
    environment:
      FAMILY_OS_BB_IPAD_PORT: 8790
      NODE_ENV: production
      NODE_OPTIONS: --use-system-ca
    ports:
      - "127.0.0.1:8791:8790"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
